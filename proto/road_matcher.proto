syntax = "proto3";

package roadmatcher.v1;

option go_package = "github.com/yurido/gps-road-detection/backend/gen/roadmatcherpb;roadmatcherpb";

service RoadMatcher {
  rpc StreamGps(stream MatchRoadRequest) returns (stream MatchRoadResponse);
  rpc MatchRoad(MatchRoadRequest) returns (MatchRoadResponse);
}

message MatchRoadRequest {
  string device_id = 1;
  uint64 sequence_id = 2;
  string timestamp = 3;
  double lat = 4;
  double lon = 5;
  double accuracy = 6;
  double speed = 7;
  double heading = 8;
  int64 last_road_id = 9;
  repeated GpsHistoryPoint history = 10;
}

message GpsHistoryPoint {
  string timestamp = 1;
  double lat = 2;
  double lon = 3;
  double accuracy = 4;
  double speed = 5;
  double heading = 6;
}

message MatchRoadResponse {
  uint64 sequence_id = 1;
  bool matched = 2;
  string confidence = 3;
  RoadCandidate best = 4;
  repeated RoadCandidate candidates = 5;
}

message RoadCandidate {
  int64 road_id = 1;
  int64 osm_id = 2;
  string name = 3;
  string highway = 4;
  string oneway = 5;
  double distance_meters = 6;
  double heading_diff = 7;
  string connectivity = 8;
  double distance_score = 9;
  double heading_score = 10;
  double connectivity_score = 11;
  double score = 12;
  repeated LatLon geometry = 13;
}

message LatLon {
  double lat = 1;
  double lon = 2;
}
